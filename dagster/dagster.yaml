# dagster.yaml
run_launcher:
  module: dagster.core.launcher # <--- Canvi clau
  class: QueuedRunLauncher

run_coordinator:
  module: dagster.core.run_coordinator # <--- També per seguretat
  class: QueuedRunCoordinator

concurrency:
  runs:
    max_concurrent_runs: 6
    tag_concurrency_limits:
      - key: "process"
        value: "ingestion"
        limit: 1 # Només permetrem 1 execució alhora amb el tag 'process'

